name: Release

# Pushing a tag like v0.2.0 builds the installer and the portable zip and attaches them to a DRAFT release.
# Nothing is signed here: the maintainer signs the update manifest on their own machine (ADR-012).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check the tag matches package.json
        run: node scripts/release-ci.mjs check-tag "${{ github.ref_name }}"

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm package
      - run: pnpm installer

      - name: Write SHA256SUMS
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-ci.mjs sums \
            "out/PilotPane-Setup-${version}.exe" \
            "out/PilotPane-${version}-win-x64.zip" \
            --out out/SHA256SUMS

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "PilotPane ${version}" \
            --notes "Draft. Not public until the maintainer has signed the update manifest and published it." \
            "out/PilotPane-Setup-${version}.exe" \
            "out/PilotPane-${version}-win-x64.zip" \
            out/SHA256SUMS
