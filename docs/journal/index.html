<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PilotPane journal</title>
<script>
  // Pick the theme before first paint: saved choice, else the system light or dark setting.
  (function () {
    var ids = ['cockpit', 'daylight', 'midnight', 'contrast'];
    var t = null;
    try { t = localStorage.getItem('pp-journal-theme'); } catch (e) {}
    if (ids.indexOf(t) < 0) t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'daylight' : 'cockpit';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="journal.css">
</head>

  <div class="wrap">
    <a href="#" class="brand">
      <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><rect x="5" y="9" width="46" height="36" rx="7" stroke-width="5"></rect><path d="M33 28 L33 57 L40.5 50 L45.5 61 L51 58.5 L46 47.5 L56 47.5 Z"></path></svg>

      <div class="themes" id="themes" role="group" aria-label="Theme"></div>

</header>
<main id="app" class="wrap"><p class="mu" style="padding-top: 64px">Loading the journal…</p></main>
